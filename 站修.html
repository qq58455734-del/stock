<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人股票交易與損益記帳本</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; }
.profit { color: #dc2626; font-weight: bold; }
.loss { color: #16a34a; font-weight: bold; }
</style>
</head>
<body class="p-4 md:p-6 max-w-5xl mx-auto text-slate-800">
<!-- 頂部多層總覽卡片 -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
<div class="bg-gradient-to-br from-indigo-500 to-purple-600 text-white p-4 rounded-2xl shadow-lg shadow-purple-500/20">
<div class="text-indigo-100 text-xs font-medium mb-1">庫存損益</div>
<div id="totalUnrealizedPL" class="text-xl sm:text-2xl font-black">$0</div>
</div>
<div class="bg-gradient-to-br from-blue-500 to-indigo-600 text-white p-4 rounded-2xl shadow-lg shadow-blue-500/20">
<div class="text-blue-100 text-xs font-medium mb-1">累計已實現損益</div>
<div id="totalRealizedPL" class="text-xl sm:text-2xl font-black">$0</div>
</div>
<div class="bg-gradient-to-br from-amber-500 to-orange-600 text-white p-4 rounded-2xl shadow-lg shadow-orange-500/20">
<div class="text-amber-100 text-xs font-medium mb-1">總報酬率</div>
<div id="totalReturnRate" class="text-xl sm:text-2xl font-black">0.00%</div>
</div>
<div class="bg-gradient-to-br from-emerald-500 to-teal-600 text-white p-4 rounded-2xl shadow-lg shadow-teal-500/20">
<div class="text-white text-xs font-medium mb-1">今日已實現損益</div>
<div id="todayRealizedPL" style="color:#ffffff;" class="text-xl sm:text-2xl text-white font-black">$0</div>
</div>
</div>
<!-- 新增交易紀錄 -->
<div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-6">
<h2 class="text-lg font-extrabold text-slate-900 mb-3 flex items-center">
<span class="w-2 h-6 bg-indigo-500 rounded-full mr-2"></span>新增交易紀錄
</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
<input type="date" id="txDate" class="border border-slate-200 rounded-2xl p-3 bg-slate-50 font-medium text-slate-700 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
<select id="txType" class="border border-slate-200 rounded-2xl p-3 bg-slate-50 font-bold text-indigo-600 focus:bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition">
<option value="BUY">買進 (Buy)</option>
<option value="SELL">賣出 (Sell)</option>
</select>
<input type="text" id="txSymbol" placeholder="股票代號/名稱 (例: 2330 台積電)" class="border border-slate-200 rounded-2xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition">
<input type="number" id="txPrice" step="0.01" placeholder="成交單價" class="border border-slate-200 rounded-2xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition">
<input type="number" id="txShares" placeholder="股數 (例: 1000)" class="border border-slate-200 rounded-2xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition">
<input type="number" id="txFee" placeholder="手續費+交易稅 (選填)" class="border border-slate-200 rounded-2xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition">
<input type="text" id="txNote" placeholder="備註 (選填)" class="col-span-1 md:col-span-2 border border-slate-200 rounded-2xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition">
<button onclick="addTransaction()" class="col-span-1 md:col-span-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-lg shadow-indigo-500/30 transition transform active:scale-98">
新增紀錄
</button>
</div>
<p class="text-xs text-slate-400">※ 損益採「移動平均成本法」計算；台股紅字代表獲利/買進，綠字代表虧損/賣出。</p>
</div>
<!-- 已實現損益統計分析 -->
<div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-6">
<div class="flex flex-wrap justify-between items-center mb-4 gap-2">
<h2 class="text-lg font-extrabold text-slate-900 flex items-center">
<span class="w-2 h-6 bg-amber-500 rounded-full mr-2"></span>已實現損益統計分析
</h2>
<div class="flex bg-slate-100 p-1.5 rounded-2xl text-sm font-bold">
<button id="btnDaily" onclick="switchPeriodTab('daily')" class="px-4 py-1.5 rounded-xl bg-white text-indigo-600 shadow-md transition">每日</button>
<button id="btnMonthly" onclick="switchPeriodTab('monthly')" class="px-4 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 transition">每月</button>
<button id="btnYearly" onclick="switchPeriodTab('yearly')" class="px-4 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 transition">每年</button>
<button id="btnStock" onclick="switchPeriodTab('stock')" class="px-4 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 transition">單檔個股</button>
</div>
</div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse">
<thead>
<tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase tracking-wider">
<th id="periodColTitle" class="py-3 px-3">完成日期</th>
<th class="py-3 px-3 text-right">交易筆數</th>
<th class="py-3 px-3 text-right">總成交金額</th>
<th class="py-3 px-3 text-right">已實現損益</th>
</tr>
</thead>
<tbody id="periodStatsBody" class="divide-y divide-slate-50 text-sm">
<tr><td colspan="4" class="py-6 text-center text-slate-400 font-medium">尚無已實現損益資料</td></tr>
</tbody>
</table>
</div>
</div>
<!-- 目前持股庫存統計 -->
<div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-6">
<div class="flex flex-wrap justify-between items-center mb-4 gap-2">
<h2 class="text-lg font-extrabold text-slate-900 flex items-center">
<span class="w-2 h-6 bg-pink-500 rounded-full mr-2"></span>目前持股庫存統計
</h2>
<div class="flex flex-wrap items-center gap-3">
<label class="flex items-center gap-1.5 text-xs font-bold text-slate-600 cursor-pointer select-none">
<input type="checkbox" id="autoUpdateToggle" onchange="toggleAutoUpdate()" checked class="w-4 h-4 accent-emerald-600 rounded">
<span>每 60 秒自動更新市價</span>
</label>
<span id="lastSyncTime" class="text-xs text-slate-400 font-medium"></span>
<button onclick="fetchAllStockPrices(false)" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-1.5 px-3 rounded-xl font-bold transition shadow-sm">
🔄 立即同步最新市價
</button>
</div>
</div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse whitespace-nowrap">
<thead>
<tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase tracking-wider">
<th class="py-3 px-3">股票代號/名稱</th>
<th class="py-3 px-3 text-right">持有股數</th>
<th class="py-3 px-3 text-right">平均成本</th>
<th class="py-3 px-3 text-right">庫存總成本</th>
<th class="py-3 px-3 text-right">目前市價</th>
<th class="py-3 px-3 text-right">未實現損益</th>
</tr>
</thead>
<tbody id="holdingsBody" class="divide-y divide-slate-50 text-sm font-medium">
<tr><td colspan="6" class="py-6 text-center text-slate-400 font-medium">尚無持股或交易紀錄</td></tr>
</tbody>
</table>
</div>
</div>
<!-- 歷史交易明細 -->
<div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
<div class="flex flex-wrap justify-between items-center gap-2 mb-4">
<h2 class="text-lg font-extrabold text-slate-900 flex items-center">
<span class="w-2 h-6 bg-emerald-500 rounded-full mr-2"></span>歷史交易明細
</h2>
<div class="flex flex-wrap gap-2">
<label class="bg-slate-800 hover:bg-slate-900 text-white text-xs md:text-sm py-2 px-4 rounded-xl font-bold cursor-pointer transition shadow-md shadow-slate-800/10">
匯入 Excel/CSV
<input type="file" id="importFile" accept=".csv, .xlsx, .xls" class="hidden" onchange="importFile(event)">
</label>
<input type="text" id="filterSymbol" oninput="renderAll()" placeholder="篩選代號/名稱..." class="border border-slate-200 rounded-xl px-3 py-1.5 text-xs md:text-sm w-32 md:w-40 outline-none focus:ring-2 focus:ring-emerald-500 transition">
<button onclick="exportCSV()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm py-2 px-4 rounded-xl font-bold transition shadow-md shadow-indigo-600/10">匯出 CSV</button>
<button onclick="clearAllData()" class="bg-rose-500 hover:bg-rose-600 text-white text-xs md:text-sm py-2 px-4 rounded-xl font-bold transition">清空資料</button>
</div>
</div>
<div class="overflow-x-auto">
<table class="w-full text-left border-collapse text-xs md:text-sm whitespace-nowrap">
<thead>
<tr class="border-b border-slate-100 text-xs font-bold text-slate-400 uppercase tracking-wider">
<th class="py-3 px-3">日期</th>
<th class="py-3 px-3">方向</th>
<th class="py-3 px-3">股票</th>
<th class="py-3 px-3 text-right">單價</th>
<th class="py-3 px-3 text-right">股數</th>
<th class="py-3 px-3 text-right">費用</th>
<th class="py-3 px-3 text-right">已實現損益</th>
<th class="py-3 px-3">備註</th>
<th class="py-3 px-3 text-center">操作</th>
</tr>
</thead>
<tbody id="historyBody" class="divide-y divide-slate-100 text-slate-700">
<tr><td colspan="9" class="py-6 text-center text-slate-400 font-medium">無符合的交易紀錄</td></tr>
</tbody>
</table>
</div>
</div>
<script>
const STORAGE_KEY = 'stock_tracker_transactions_v6';
const MARKET_PRICE_KEY = 'stock_tracker_market_prices_v2';
const AUTO_UPDATE_KEY = 'stock_tracker_auto_update_v1';
let transactions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let marketPrices = JSON.parse(localStorage.getItem(MARKET_PRICE_KEY)) || {};
let currentPeriodTab = 'daily';
let autoUpdateTimer = null;

// Google 試算表 CSV 公開連結
const GOOGLE_SHEET_CSV_URL ='https://docs.google.com/spreadsheets/d/e/2PACX-1vS4T56sFTEmvimWyhOX10x7-d9TTCEU34vzV8w3lIQABsL9yMd7sGQ7pFewiJmI3zRtslQsuHz5O7BY/pub?output=csv';

const now = new Date();
const localToday = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
document.getElementById('txDate').value = localToday;

function normalizeSymbol(symbol) {
  if (!symbol) return '';
  const str = String(symbol).trim().toUpperCase();
  let match = str.match(/\(([0-9A-Z]{4,7})\)/);
  if (match) return match[1];
  match = str.match(/^([0-9A-Z]{4,7})(?:\s|$|-)/);
  if (match) return match[1];
  match = str.match(/(\d{4,6}[A-Z]{0,2})/);
  if (match) return match[1];
  return str;
}

function getDisplaySymbol(tx) {
  return tx.displaySymbol || tx.symbol;
}

function saveTransactions() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
}

function saveMarketPrices() {
  localStorage.setItem(MARKET_PRICE_KEY, JSON.stringify(marketPrices));
}

function updateMarketPrice(normKey, val) {
  const parsed = parseFloat(val);
  if (isNaN(parsed) || parsed <= 0) {
    delete marketPrices[normKey];
  } else {
    marketPrices[normKey] = parsed;
  }
  saveMarketPrices();
  renderAll();
}

function toggleAutoUpdate() {
  const isChecked = document.getElementById('autoUpdateToggle').checked;
  localStorage.setItem(AUTO_UPDATE_KEY, isChecked ? '1' : '0');
  if (autoUpdateTimer) {
    clearInterval(autoUpdateTimer);
    autoUpdateTimer = null;
  }
  if (isChecked) {
    autoUpdateTimer = setInterval(() => {
      fetchAllStockPrices(true);
    }, 60000);
  }
}

function initAutoUpdate() {
  const saved = localStorage.getItem(AUTO_UPDATE_KEY);
  const toggleEl = document.getElementById('autoUpdateToggle');
  toggleEl.checked = saved === null ? true : saved === '1';
  toggleAutoUpdate();
  if (toggleEl.checked) {
    fetchAllStockPrices(true);
  }
}

// 從 Google 試算表 CSV 解析股價並自動對應更新 (silent=true 時不彈出 alert 干擾操作)
async function fetchAllStockPrices(silent = false) {
  const { inventory } = calculatePortfolio();
  const activeSymbols = Object.keys(inventory).filter(k => inventory[k].shares > 0);
  if (activeSymbols.length === 0) {
    if (!silent) alert('目前沒有持有中的股票庫存！');
    return;
  }
  const statusEl = document.getElementById('lastSyncTime');
  if (statusEl) statusEl.textContent = '同步中...';

  try {
    const cacheBuster = "&t=" + Date.now();
     const response = await fetch(GOOGLE_SHEET_CSV_URL + cacheBuster);
    const csvText = await response.text();
    const rows = csvText.split('\n').map(row => {
      const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
      return matches ? matches.map(m => m.replace(/^"|"$/g, '').trim()) : row.split(',').map(s => s.trim());
    });

    let updatedCount = 0;
    const foundPrices = {};
    for (const row of rows) {
      if (!row || row.length === 0) continue;
      let parsedCode = null;
      let parsedPrice = null;
      for (const cell of row) {
        const cleanCell = cell.replace(/[,\s]/g, '');
        if ((!parsedCode && /^\d{4,6}[A-Z]{0,2}$/.test(cleanCell)) || /^\d{4}\.[A-Z]{2}$/.test(cleanCell)) {
          parsedCode = cleanCell.replace(/\.[A-Z]{2}$/, '');
        } else if (!parsedPrice && !isNaN(parseFloat(cleanCell)) && parseFloat(cleanCell) > 0) {
          const num = parseFloat(cleanCell);
          if (num > 0.1 && num < 1000000) {
            parsedPrice = num;
          }
        }
      }
      if (parsedCode && parsedPrice !== null) {
        foundPrices[normalizeSymbol(parsedCode)] = parsedPrice;
      }
    }

    for (const sym of activeSymbols) {
      if (foundPrices[sym] !== undefined && foundPrices[sym] > 0) {
        marketPrices[sym] = Number(foundPrices[sym].toFixed(2));
        updatedCount++;
      } else {
        console.warn(`未能在 CSV 資料中自動對應到代號 ${sym} 的價格。`);
      }
    }

    saveMarketPrices();
    renderAll();
    const syncNow = new Date();
    const timeStr = `${String(syncNow.getHours()).padStart(2, '0')}:${String(syncNow.getMinutes()).padStart(2, '0')}:${String(syncNow.getSeconds()).padStart(2, '0')}`;
    if (statusEl) statusEl.textContent = `上次更新：${timeStr}`;
    if (!silent) {
      alert(`同步完成！共更新 ${updatedCount} 檔庫存股票的最新市價。`);
    }
  } catch (err) {
    console.error('同步試算表股價失敗：', err);
    if (statusEl) statusEl.textContent = '自動同步失敗';
    if (!silent) {
      alert('同步失敗：' + err.message + '\n請確認您的 Google 試算表是否已成功設定為「發布到網路」並選擇 CSV 格式。');
    }
  }
}

function addTransaction() {
  const date = document.getElementById('txDate').value;
  const type = document.getElementById('txType').value;
  const rawSymbol = document.getElementById('txSymbol').value.trim();
  const price = parseFloat(document.getElementById('txPrice').value);
  const shares = parseInt(document.getElementById('txShares').value, 10);
  const fee = parseFloat(document.getElementById('txFee').value) || 0;
  const note = document.getElementById('txNote').value.trim();

  if (!date || !rawSymbol || isNaN(price) || price <= 0 || isNaN(shares) || shares <= 0) {
    alert('請填寫完整的日期、股票代號/名稱、單價與股數！');
    return;
  }

  const normKey = normalizeSymbol(rawSymbol);
  transactions.push({
    id: Date.now().toString() + Math.random().toString(36).substring(2, 7),
    date,
    type,
    symbol: normKey,
    displaySymbol: rawSymbol,
    price,
    shares,
    fee,
    note
  });

  saveTransactions();
  document.getElementById('txPrice').value = '';
  document.getElementById('txShares').value = '';
  document.getElementById('txFee').value = '';
  document.getElementById('txNote').value = '';
  renderAll();
}

function deleteTransaction(id) {
  if (!confirm('確定要刪除此筆交易紀錄嗎？')) return;
  transactions = transactions.filter(t => t.id !== id);
  saveTransactions();
  renderAll();
}

function clearAllData() {
  if (!confirm('確定要清空所有交易紀錄嗎？此動作無法復原！')) return;
  transactions = [];
  marketPrices = {};
  saveTransactions();
  saveMarketPrices();
  renderAll();
}

function switchPeriodTab(tab) {
  currentPeriodTab = tab;
  ['daily', 'monthly', 'yearly', 'stock'].forEach(t => {
    const btn = document.getElementById(`btn${t.charAt(0).toUpperCase() + t.slice(1)}`);
    if (t === tab) {
      btn.className = 'px-4 py-1.5 rounded-xl bg-white text-indigo-600 shadow-md transition';
    } else {
      btn.className = 'px-4 py-1.5 rounded-xl text-slate-600 hover:text-slate-900 transition';
    }
  });
  renderAll();
}

function calculatePortfolio() {
  const sorted = [...transactions].sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  const inventory = {};
  const displayNames = {};
  let totalRealizedPL = 0;
  let totalSellCostBasis = 0;
  let todayRealizedPL = 0;
  const dailyStats = {};
  const monthlyStats = {};
  const yearlyStats = {};
  const stockStats = {};

  const enrichedTx = sorted.map(tx => {
    const normKey = normalizeSymbol(tx.symbol);
    const dispName = getDisplaySymbol(tx);
    if (!displayNames[normKey] || dispName.length > displayNames[normKey].length) {
      displayNames[normKey] = dispName;
    }
    if (!inventory[normKey]) {
      inventory[normKey] = { shares: 0, totalCost: 0, displayName: displayNames[normKey] };
    }
    inventory[normKey].displayName = displayNames[normKey];

    const item = inventory[normKey];
    let realizedPL = null;

    if (!stockStats[normKey]) {
      stockStats[normKey] = { count: 0, sellAmount: 0, pl: 0, label: displayNames[normKey] };
    }
    stockStats[normKey].label = displayNames[normKey];

    if (tx.type === 'BUY') {
      const cost = (tx.price * tx.shares) + tx.fee;
      item.shares += tx.shares;
      item.totalCost += cost;
    } else if (tx.type === 'SELL') {
      const avgCost = item.shares > 0 ? (item.totalCost / item.shares) : 0;
      const costBasis = avgCost * tx.shares;
      const netProceeds = (tx.price * tx.shares) - tx.fee;
      realizedPL = (item.shares > 0 || tx.importedPL === undefined || tx.importedPL === null)
        ? (netProceeds - costBasis)
        : tx.importedPL;
      totalRealizedPL += realizedPL;
      totalSellCostBasis += costBasis > 0 ? costBasis : (tx.price * tx.shares);
      if (tx.date === localToday) {
        todayRealizedPL += realizedPL;
      }
      item.shares = Math.max(0, item.shares - tx.shares);
      item.totalCost = Math.max(0, item.totalCost - costBasis);

      const dayKey = tx.date;
      const monthKey = tx.date.substring(0, 7);
      const yearKey = tx.date.substring(0, 4);

      if (!dailyStats[dayKey]) dailyStats[dayKey] = { count: 0, sellAmount: 0, pl: 0, label: dayKey };
      dailyStats[dayKey].count += 1;
      dailyStats[dayKey].sellAmount += (tx.price * tx.shares);
      dailyStats[dayKey].pl += realizedPL;

      if (!monthlyStats[monthKey]) monthlyStats[monthKey] = { count: 0, sellAmount: 0, pl: 0, label: monthKey };
      monthlyStats[monthKey].count += 1;
      monthlyStats[monthKey].sellAmount += (tx.price * tx.shares);
      monthlyStats[monthKey].pl += realizedPL;

      if (!yearlyStats[yearKey]) yearlyStats[yearKey] = { count: 0, sellAmount: 0, pl: 0, label: yearKey };
      yearlyStats[yearKey].count += 1;
      yearlyStats[yearKey].sellAmount += (tx.price * tx.shares);
      yearlyStats[yearKey].pl += realizedPL;

      stockStats[normKey].count += 1;
      stockStats[normKey].sellAmount += (tx.price * tx.shares);
      stockStats[normKey].pl += realizedPL;
    }
    return { ...tx, normKey, displayLabel: dispName, realizedPL };
  });

  let currentTotalCost = 0;
  let totalUnrealizedPL = 0;
  Object.entries(inventory).forEach(([normKey, inv]) => {
    if (inv.shares > 0) {
      currentTotalCost += inv.totalCost;
      const mktPrice = marketPrices[normKey];
      if (mktPrice !== undefined && !isNaN(mktPrice) && mktPrice > 0) {
        const marketValue = mktPrice * inv.shares;
        inv.unrealizedPL = marketValue - inv.totalCost;
        totalUnrealizedPL += inv.unrealizedPL;
      } else {
        inv.unrealizedPL = 0;
      }
    }
  });

  let periodMap = dailyStats;
  let title = "完成日期";
  if (currentPeriodTab === 'monthly') { periodMap = monthlyStats; title = "統計月份"; }
  else if (currentPeriodTab === 'yearly') { periodMap = yearlyStats; title = "統計年份"; }
  else if (currentPeriodTab === 'stock') { periodMap = stockStats; title = "股票代號/名稱"; }

  return {
    enrichedTx: enrichedTx.reverse(),
    inventory,
    currentTotalCost,
    totalUnrealizedPL,
    totalRealizedPL,
    todayRealizedPL,
    totalSellCostBasis,
    periodMap,
    periodColTitle: title
  };
}

function formatCurrency(num) {
  return Math.round(num).toLocaleString('zh-TW');
}

function getPLClass(val) {
  if (val > 0) return 'profit';
  if (val < 0) return 'loss';
  return 'text-slate-700';
}

function getCardPLClass(val) {
  if (val > 0) return 'profit';
  if (val < 0) return 'loss';
  return 'text-white';
}

function renderAll() {
  const {
    enrichedTx, inventory, totalUnrealizedPL,
    totalRealizedPL, todayRealizedPL, totalSellCostBasis,
    periodMap, periodColTitle
  } = calculatePortfolio();

  const unrealizedEl = document.getElementById('totalUnrealizedPL');
  unrealizedEl.textContent = `${totalUnrealizedPL > 0 ? '+' : ''}$${formatCurrency(totalUnrealizedPL)}`;
  unrealizedEl.className = `text-xl sm:text-2xl font-black ${getCardPLClass(totalUnrealizedPL)}`;

  const plEl = document.getElementById('totalRealizedPL');
  plEl.textContent = `${totalRealizedPL > 0 ? '+' : ''}$${formatCurrency(totalRealizedPL)}`;
  plEl.className = `text-xl sm:text-2xl font-black ${getCardPLClass(totalRealizedPL)}`;

  const todayEl = document.getElementById('todayRealizedPL');
  todayEl.textContent = `${todayRealizedPL > 0 ? '+' : ''}$${formatCurrency(todayRealizedPL)}`;
  todayEl.className = `text-xl sm:text-2xl font-black ${getCardPLClass(todayRealizedPL)}`;

  const rate = totalSellCostBasis > 0 ? (totalRealizedPL / totalSellCostBasis) * 100 : 0;
  const rateEl = document.getElementById('totalReturnRate');
  rateEl.textContent = `${rate > 0 ? '+' : ''}${rate.toFixed(2)}%`;
  rateEl.className = `text-xl sm:text-2xl font-black ${getCardPLClass(rate)}`;

  document.getElementById('periodColTitle').textContent = periodColTitle;
  const periodBody = document.getElementById('periodStatsBody');
  const periodKeys = Object.keys(periodMap)
    .filter(k => periodMap[k].count > 0)
    .sort((a, b) => b.localeCompare(a));

  if (periodKeys.length === 0) {
    periodBody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-slate-400 font-medium">尚無已實現損益資料</td></tr>';
  } else {
    periodBody.innerHTML = periodKeys.map(key => {
      const stat = periodMap[key];
      const plSign = stat.pl > 0 ? '+' : '';
      return `<tr class="hover:bg-slate-50 transition border-b border-slate-50 last:border-0 font-medium">
        <td class="py-4 px-3 text-indigo-600 font-extrabold">${stat.label || key}</td>
        <td class="py-4 px-3 text-right text-slate-600">${stat.count}</td>
        <td class="py-4 px-3 text-right text-slate-600">$${formatCurrency(stat.sellAmount)}</td>
        <td class="py-4 px-3 text-right ${getPLClass(stat.pl)}">${plSign}$${formatCurrency(stat.pl)}</td>
      </tr>`;
    }).join('');
  }

  const holdingsBody = document.getElementById('holdingsBody');
  const activeHoldings = Object.entries(inventory).filter(([_, data]) => data.shares > 0);
  if (activeHoldings.length === 0) {
    holdingsBody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-slate-400 font-medium">尚無持股或交易紀錄</td></tr>';
  } else {
    holdingsBody.innerHTML = activeHoldings.map(([normKey, data]) => {
      const avg = data.totalCost / data.shares;
      const mktPrice = marketPrices[normKey] !== undefined ? marketPrices[normKey] : '';
      const uPL = data.unrealizedPL || 0;
      const uPLSign = uPL > 0 ? '+' : '';
      const uPLDisplay = mktPrice !== '' ? `${uPLSign}$${formatCurrency(uPL)}` : '$0';
      return `<tr class="hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
        <td class="py-4 px-3 text-pink-600 font-extrabold">${data.displayName || normKey}</td>
        <td class="py-4 px-3 text-right text-slate-600">${data.shares.toLocaleString()}</td>
        <td class="py-4 px-3 text-right text-slate-600">${avg.toFixed(2)}</td>
        <td class="py-4 px-3 text-right text-slate-800 font-bold">$${formatCurrency(data.totalCost)}</td>
        <td class="py-4 px-3 text-right">
          <input type="number" step="0.01" value="${mktPrice}" placeholder="自動/手動輸入" onchange="updateMarketPrice('${normKey}', this.value)" class="w-32 text-right border border-slate-200 rounded-xl px-2.5 py-1 text-slate-700 font-semibold focus:ring-2 focus:ring-indigo-500 outline-none transition">
        </td>
        <td class="py-4 px-3 text-right font-bold ${getPLClass(uPL)}">${uPLDisplay}</td>
      </tr>`;
    }).join('');
  }

  const filter = document.getElementById('filterSymbol').value.trim().toLowerCase();
  const filteredTx = enrichedTx.filter(t =>
    t.normKey.toLowerCase().includes(filter) ||
    t.displayLabel.toLowerCase().includes(filter)
  );

  const historyBody = document.getElementById('historyBody');
  if (filteredTx.length === 0) {
    historyBody.innerHTML = '<tr><td colspan="9" class="py-6 text-center text-slate-400 font-medium">無符合的交易紀錄</td></tr>';
  } else {
    historyBody.innerHTML = filteredTx.map(tx => {
      const isBuy = tx.type === 'BUY';
      const dirClass = isBuy ? 'bg-rose-100 text-rose-600 border border-rose-200' : 'bg-emerald-100 text-emerald-600 border border-emerald-200';
      const plDisplay = tx.realizedPL !== null
        ? `<span class="${getPLClass(tx.realizedPL)}">${tx.realizedPL > 0 ? '+' : ''}${formatCurrency(tx.realizedPL)}</span>`
        : '-';
      return `<tr class="hover:bg-slate-50 transition border-b border-slate-50 last:border-0">
        <td class="py-4 px-3 text-slate-500 text-xs font-semibold">${tx.date}</td>
        <td class="py-4 px-3"><span class="px-2.5 py-1 rounded-full text-xs font-extrabold ${dirClass}">${isBuy ? '買進' : '賣出'}</span></td>
        <td class="py-4 px-3 font-extrabold text-slate-900">${tx.displayLabel}</td>
        <td class="py-4 px-3 text-right font-semibold">${tx.price}</td>
        <td class="py-4 px-3 text-right font-semibold">${tx.shares.toLocaleString()}</td>
        <td class="py-4 px-3 text-right text-slate-400">${tx.fee.toLocaleString()}</td>
        <td class="py-4 px-3 text-right font-black text-base">${plDisplay}</td>
        <td class="py-4 px-3 text-slate-400 text-xs truncate max-w-[120px]">${tx.note || '<span class="text-slate-200">-</span>'}</td>
        <td class="py-4 px-3 text-center">
          <button onclick="deleteTransaction('${tx.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-500 font-bold px-3 py-1 rounded-lg text-xs transition">刪除</button>
        </td>
      </tr>`;
    }).join('');
  }
}

function exportCSV() {
  const { enrichedTx } = calculatePortfolio();
  if (enrichedTx.length === 0) {
    alert('目前沒有交易紀錄可匯出！');
    return;
  }
  const headers = ['日期', '的方向', '股票代號/名稱', '成交單價', '股數', '手續費+交易稅', '已實現損益', '備註'];
  const rows = enrichedTx.map(t => [
    t.date,
    t.type === 'BUY' ? '買進' : '賣出',
    `"${t.displayLabel.replace(/"/g, '""')}"`,
    t.price,
    t.shares,
    t.fee,
    t.realizedPL !== null ? Math.round(t.realizedPL) : '',
    `"${(t.note || '').replace(/"/g, '""')}"`
  ]);
  const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `股票交易紀錄_${localToday}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function parseNum(val) {
  if (val === undefined || val === null || val === '') return NaN;
  if (typeof val === 'number') return val;
  let str = String(val).trim();
  let isNegative = false;
  if (/^\(.*\)$/.test(str)) {
    isNegative = true;
    str = str.slice(1, -1);
  }
  const cleaned = str.replace(/[,\s元股%]/g, '');
  const num = parseFloat(cleaned);
  if (isNaN(num)) return NaN;
  return isNegative ? -Math.abs(num) : num;
}

function parseDateStr(rawDate) {
  if (!rawDate && rawDate !== 0) return '';
  if (typeof rawDate === 'number') {
    const numStr = String(Math.floor(rawDate));
    if (/^\d{7}$/.test(numStr)) {
      const y = parseInt(numStr.slice(0, 3), 10) + 1911;
      return `${y}-${numStr.slice(3, 5)}-${numStr.slice(5, 7)}`;
    }
    if (/^\d{8}$/.test(numStr)) {
      return `${numStr.slice(0, 4)}-${numStr.slice(4, 6)}-${numStr.slice(6, 8)}`;
    }
    const parsed = XLSX.SSF.parse_date_code(rawDate);
    if (parsed && parsed.y > 0) {
      return `${parsed.y}-${String(parsed.m).padStart(2, '0')}-${String(parsed.d).padStart(2, '0')}`;
    }
  }
  let str = String(rawDate).trim().replace(/[/.]/g, '-');
  if (!str || str.includes('#')) return '';
  const roc7Match = str.match(/^(\d{3})(\d{2})(\d{2})$/);
  if (roc7Match) {
    const y = parseInt(roc7Match[1], 10) + 1911;
    return `${y}-${roc7Match[2]}-${roc7Match[3]}`;
  }
  const rocMatch = str.match(/^(\d{2,3})-(\d{1,2})-(\d{1,2})/);
  if (rocMatch && parseInt(rocMatch[1], 10) < 1911) {
    const y = parseInt(rocMatch[1], 10) + 1911;
    return `${y}-${roc7Match[2].padStart(2, '0')}-${roc7Match[3].padStart(2, '0')}`;
  }
  const compactMatch = str.match(/^(\d{4})(\d{2})(\d{2})$/);
  if (compactMatch) {
    return `${compactMatch[1]}-${compactMatch[2]}-${compactMatch[3]}`;
  }
  const isoMatch = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (isoMatch) {
    return `${isoMatch[1]}-${isoMatch[2].padStart(2, '0')}-${isoMatch[3].padStart(2, '0')}`;
  }
  return '';
}

function importFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const isCSV = file.name.toLowerCase().endsWith('.csv');
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const buffer = e.target.result;
      let workbook;
      if (isCSV) {
        let text = '';
        try {
          const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
          text = utf8Decoder.decode(buffer);
        } catch (_) {
          const big5Decoder = new TextDecoder('big5');
          text = big5Decoder.decode(buffer);
        }
        workbook = XLSX.read(text, { type: 'string' });
      } else {
        const data = new Uint8Array(buffer);
        workbook = XLSX.read(data, { type: 'array' });
      }

      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rawRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
      if (!rawRows || rawRows.length === 0) {
        alert('檔案內容為空！');
        return;
      }

      let headerRowIdx = -1;
      for (let i = 0; i < Math.min(20, rawRows.length); i++) {
        const rowStr = rawRows[i].join('|');
        if (rowStr.includes('股') || rowStr.includes('日期') || rowStr.includes('單價') || rowStr.includes('成本') || rowStr.includes('Symbol')) {
          headerRowIdx = i;
          break;
        }
      }
      if (headerRowIdx === -1) headerRowIdx = 0;

      const headers = rawRows[headerRowIdx].map(h => String(h).trim());
      const findCol = (keywords) => headers.findIndex(h => keywords.some(k => h.includes(k)));
      const idxDate = findCol(['成交日期', '交易日期', '日期', 'Date']);
      const idxDir = findCol(['買賣別', '交易別', '買賣', '方向', '類別', 'Type']);
      const idxCode = findCol(['股票代號', '證券代號', '代號', 'Symbol']);
      const idxName = findCol(['股票名稱', '證券名稱', '商品名稱', '股名', '股票', 'Name']);
      const idxPrice = findCol(['成交單價', '成交價', '單價', '價格', 'Price', '成交均價']);
      const idxShares = findCol(['成交股數', '庫存股數', '股數', '數量', 'Shares', 'Qty']);
      const idxCost = findCol(['持有成本', '總成本', '成本', '成交金額']);
      const idxFee = findCol(['手續費', 'Fee']);
      const idxTax = findCol(['證交稅', '交易稅', '稅', 'Tax']);
      const idxTotalFee = findCol(['手續費+交易稅', '總費用', '費用']);
      const idxPL = findCol(['已實現損益', '損益', '獲利', 'P/L']);
      const idxNote = findCol(['備註', '說明', 'Note']);
      const idxMarketPrice = findCol(['目前市價', '市價', '現價', '收盤價', 'MarketPrice']);

      let importedCount = 0;
      let skippedInvalidDateCount = 0;

      for (let r = headerRowIdx + 1; r < rawRows.length; r++) {
        const row = rawRows[r];
        if (!row || row.every(cell => String(cell).trim() === '')) continue;
        const firstCells = row.slice(0, 4).join('');
        if (firstCells.includes('合計') || firstCells.includes('小計') || firstCells.includes('總計')) continue;

        const is16Col = row.length >= 16 && idxDate === -1 && idxDir === -1;
        const rawDate = idxDate !== -1 ? row[idxDate] : (is16Col ? row[0] : '');
        const rawDir = String(idxDir !== -1 ? row[idxDir] : (is16Col ? row[2] : '')).trim();

        let rawSymbol = '';
        if (idxCode !== -1 && idxName !== -1 && idxCode !== idxName) {
          const c = String(row[idxCode] || '').trim();
          const n = String(row[idxName] || '').trim();
          rawSymbol = (c && n && !n.includes(c)) ? `${n}(${c})` : (n || c);
        } else if (idxName !== -1) {
          rawSymbol = String(row[idxName] || '').trim();
        } else if (idxCode !== -1) {
          rawSymbol = String(row[idxCode] || '').trim();
        } else if (is16Col) {
          const c = String(row[3] || '').trim();
          const n = String(row[4] || '').trim();
          rawSymbol = (c && n) ? `${n}(${c})` : (n || c);
        } else {
          rawSymbol = String(row[0] || '').trim();
        }

        const shares = Math.abs(parseNum(idxShares !== -1 ? row[idxShares] : (is16Col ? row[5] : row[3])));
        let price = parseNum(idxPrice !== -1 ? row[idxPrice] : (is16Col ? row[6] : NaN));
        const totalCostVal = idxCost !== -1 ? parseNum(row[idxCost]) : (is16Col ? parseNum(row[7]) : NaN);

        let fee = 0;
        if (idxTotalFee !== -1) {
          fee = parseNum(row[idxTotalFee]) || 0;
        } else {
          const f = idxFee !== -1 ? (parseNum(row[idxFee]) || 0) : (is16Col ? (parseNum(row[8]) || 0) : 0);
          const t = idxTax !== -1 ? (parseNum(row[idxTax]) || 0) : (is16Col ? (parseNum(row[9]) || 0) : 0);
          fee = f + t;
        }

        if ((isNaN(price) || price <= 0) && !isNaN(totalCostVal) && totalCostVal > 0 && !isNaN(shares) && shares > 0) {
          price = Math.max(0.01, (totalCostVal - fee) / shares);
        }

        const importedPL = idxPL !== -1 ? parseNum(row[idxPL]) : (is16Col ? parseNum(row[12]) : NaN);
        const note = String(idxNote !== -1 ? (row[idxNote] || '') : (is16Col ? (row[15] || '') : '')).trim();
        const mktPriceVal = idxMarketPrice !== -1 ? parseNum(row[idxMarketPrice]) : NaN;
        const normKey = normalizeSymbol(rawSymbol);

        if (normKey && !isNaN(mktPriceVal) && mktPriceVal > 0) {
          marketPrices[normKey] = mktPriceVal;
        }

        const formattedDate = parseDateStr(rawDate);
        if (!formattedDate) {
          if (rawSymbol && !isNaN(shares) && shares > 0) {
            skippedInvalidDateCount++;
          }
          continue;
        }

        let type = '';
        if (rawDir.includes('買') || rawDir.includes('進') || rawDir.toUpperCase() === 'BUY' || rawDir.toUpperCase() === 'B') {
          type = 'BUY';
        } else if (rawDir.includes('賣') || rawDir.includes('出') || rawDir.toUpperCase() === 'SELL' || rawDir.toUpperCase() === 'S') {
          type = 'SELL';
        } else if (!isNaN(shares) && shares > 0 && !isNaN(price) && price > 0) {
          type = 'BUY';
        }

        if (formattedDate && type && normKey && !isNaN(price) && price > 0 && !isNaN(shares) && shares > 0) {
          transactions.push({
            id: Date.now().toString() + Math.random().toString(36).substring(2, 8),
            date: formattedDate,
            type,
            symbol: normKey,
            displaySymbol: rawSymbol,
            price: Number(price.toFixed(4)),
            shares,
            fee,
            importedPL: !isNaN(importedPL) ? importedPL : null,
            note: note || (!rawDir ? '庫存/成本匯入' : '')
          });
          importedCount++;
        }
      }

      if (importedCount > 0) {
        saveTransactions();
        saveMarketPrices();
        renderAll();
        let msg = `成功匯入 ${importedCount} 筆資料！`;
        if (skippedInvalidDateCount > 0) {
          msg += `\n（已略過 ${skippedInvalidDateCount} 筆無有效日期的資料）`;
        }
        alert(msg);
      } else {
        alert('找不到符合格式的交易或庫存資料！');
      }
    } catch (err) {
      alert('檔案解析失敗：' + err.message);
    } finally {
      event.target.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}

renderAll();
initAutoUpdate();
</script>
